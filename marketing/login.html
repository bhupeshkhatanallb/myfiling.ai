<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Log in - myfiling.ai</title>
<meta name="description" content="Log in to your myfiling.ai account." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/site.css" />
</head>
<body>

<header class="nav">
  <div class="nav__inner">
    <a class="brand" href="/"><span class="brand__mark">M</span> myfiling<span class="brand__dot">.ai</span></a>
    <nav class="nav__links">
      <a class="nav__link" href="/#features">Features</a>
      <a class="nav__link" href="/pricing">Pricing</a>
      <a class="nav__link" href="/about">About</a>
      <a class="nav__link" href="/contact">Contact</a>
    </nav>
    <div class="nav__actions">
      <a class="nav__signin" href="/login">Log in</a>
      <a class="btn btn--primary" href="/register">Get Started</a>
      <button class="nav__toggle" aria-label="Menu"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
    </div>
  </div>
  <div class="nav__mobile">
    <a href="/#features">Features</a><a href="/pricing">Pricing</a><a href="/about">About</a><a href="/contact">Contact</a><a href="/login">Log in</a><a class="btn btn--primary" href="/register">Get Started</a>
  </div>
</header>

<main class="authpage">
  <div class="authcard">
    <h1>Welcome back</h1>
    <p class="authcard__sub">Log in to analyse filings and view your reports.</p>
    <form id="authPageForm" data-mode="login">
      <div class="formerror" id="authPageError" style="display:none"></div>
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com" /></div>
      <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Your password" /></div>
      <button type="submit" class="btn btn--primary btn--block btn--lg" id="authPageSubmit">Log in</button>
    </form>
    <p class="authswitch">New here? <a href="/register">Create a free account</a></p>
  </div>
</main>

<script src="/assets/site.js"></script>
</body>
</html>
