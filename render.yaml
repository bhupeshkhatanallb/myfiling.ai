# Render Blueprint for myfiling.ai (team-testing deploy).
# Free Web Service: builds from the repo, serves the dashboard + /api on one HTTPS URL.
#
# Notes:
#  * The free instance SLEEPS after ~15 min idle and cold-starts in ~30-50s - fine
#    for testing.
#  * The filesystem is EPHEMERAL: recents.db lives under /tmp so it never fails on
#    write, but "recent uploads" history resets on each restart/deploy. Acceptable
#    for testing; add a paid disk or Postgres later for persistence.
services:
  - type: web
    name: myfiling-test
    runtime: python
    plan: free
    region: singapore                 # closest free region to India (lower latency)
    buildCommand: pip install -r requirements.txt
    # Single worker: each worker holds its own copy of the loaded libs + any
    # in-flight document, so >1 worker multiplies memory and OOMs a 512 MB box.
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: RECENTS_DB_PATH
        value: /tmp/recents.db         # writable on the ephemeral free filesystem
      # Memory safety for the 512 MB free tier (peak ~190 MB on a 92-page scan):
      - key: MAX_ANALYZE_PAGES
        value: "150"                   # cap pages so a huge scanned book can't OOM
      - key: QUALITY_RENDER_DPI
        value: "130"                   # render DPI for blur measurement (vs 150 local)
      - key: QUALITY_MAX_PAGES
        value: "80"                    # how many pages are rasterised for DPI/blur
      - key: ENABLE_OCR
        value: "false"                 # OCR is heavy + Tesseract isn't installed here
